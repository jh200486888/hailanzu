<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- 坛子线描logo - 开盖版（极简+双耳） -->
  
  <!-- 蒸汽 - 三缕 -->
  <path d="M 80 44 Q 76 28 82 14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M 80 44 Q 76 28 82 14;M 80 42 Q 74 26 80 10;M 80 44 Q 76 28 82 14" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 100 40 Q 96 22 102 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M 100 40 Q 96 22 102 8;M 100 38 Q 94 20 100 4;M 100 40 Q 96 22 102 8" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 120 44 Q 116 28 122 14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M 120 44 Q 116 28 122 14;M 120 42 Q 114 26 120 10;M 120 44 Q 116 28 122 14" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- 开盖 - 盖子偏右上方 -->
  <!-- 盖钮 -->
  <circle cx="148" cy="40" r="8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 盖钮连接线 -->
  <line x1="148" y1="48" x2="148" y2="56" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 盖子两道平行横线（斜置） -->
  <line x1="110" y1="60" x2="166" y2="52" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="108" y1="72" x2="162" y2="64" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- 坛口边缘 -->
  <line x1="56" y1="80" x2="144" y2="80" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- 坛身 - U形 -->
  <path d="M 56 80 L 56 210 Q 56 256 100 256 Q 144 256 144 210 L 144 80" 
        fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 左耳 -->
  <path d="M 56 120 Q 32 120 32 150 Q 32 180 56 180" 
        fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 右耳 -->
  <path d="M 144 120 Q 168 120 168 150 Q 168 180 144 180" 
        fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</svg>
