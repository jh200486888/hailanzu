<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- 坛子线描logo - 盖盖版（极简，与网站导航栏一致） -->
  
  <!-- 顶部小圆（盖钮） -->
  <circle cx="100" cy="32" r="10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 盖钮连接线 -->
  <line x1="100" y1="42" x2="100" y2="56" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 盖子 - 两道平行横线 -->
  <line x1="60" y1="56" x2="140" y2="56" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="56" y1="68" x2="144" y2="68" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 坛身 - U形 -->
  <path d="M 56 68 L 56 210 Q 56 256 100 256 Q 144 256 144 210 L 144 68" 
        fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
