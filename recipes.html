<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菹味食谱 | 海兰菹 HAILANZU</title>
    <meta name="description" content="泡菜怎么吃？海兰菹为你带来延边朝鲜族传统泡菜食谱：泡菜锅、泡菜拌饭、泡菜五花肉等经典做法，3分钟上手。">
    <meta name="keywords" content="泡菜食谱,泡菜怎么吃,泡菜锅,泡菜拌饭,朝鲜族泡菜做法,海兰菹,延边泡菜">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
        a, button { -webkit-tap-highlight-color: transparent; outline: none; }
:root {
            --azalea: #C4727F;
            --azalea-dark: #8B4A5A;
            --ink: #1A3C34;
            --ink-deep: #0F2420;
            --ink-light: #2A5A4E;
            --ink-mid: #1E4A40;
            --seal: #C8102E;
            --seal-glow: rgba(200,16,46,.25);
            --seal-dark: #9B0D23;
            --rice: #F5F0E8;
            --rice-dim: #E8E0D4;
            --rice-deep: #D4CBBD;
            --gold: #B8860B;
            --gold-dim: rgba(184,134,11,.15);
            --gold-light: #D4A84B;
            --brown: #3D2B1F;
            --brown-light: #6B5744;
            --font-serif: 'Noto Serif SC', serif;
            --font-sans: 'Noto Sans SC', sans-serif;
            --font-serif-kr: 'Noto Serif KR', serif;
            --font-sans-kr: 'Noto Sans KR', sans-serif;
            --font-serif-jp: 'Noto Serif JP', serif;
            --font-sans-jp: 'Noto Sans JP', sans-serif;
            --font-display: 'Playfair Display', serif;
            --font-body: 'Inter', 'Noto Sans SC', sans-serif;
            --ease-out: cubic-bezier(.22,1,.36,1);
        }

        html { scroll-behavior: smooth; font-size: 16px; overflow-x: hidden; }
        body { overflow-x: clip; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans); background-color: var(--rice); color: var(--ink);
            line-height: 1.6; overscroll-behavior-x: none;
        }
        section, footer { overflow: hidden; }

        /* ===== Navigation ===== */
        .nav {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 1000; padding: 0 2rem; height: 70px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(26,60,52,0.88);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(184,134,11,0.18);
            transition: all 0.3s var(--ease-out);
        }
        .nav.scrolled { background: rgba(26,60,52,0.94); box-shadow: 0 2px 24px rgba(0,0,0,0.12), 0 1px 0 rgba(184,134,11,0.25); }
        .nav-logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--rice); }
        .pot-icon { width: 36px; height: 36px; }
        .nav-logo-text { display: flex; flex-direction: column; line-height: 1.2; }
        .nav-logo-text .zh { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em; }
        .nav-logo-text .kr { font-family: var(--font-sans-kr); font-size: 0.7rem; color: var(--rice-dim); letter-spacing: 0.02em; }
        .nav-links { display: flex; align-items: center; gap: 2rem; }
        .nav-link {
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-sans); font-size: 0.9rem; color: var(--rice);
            text-decoration: none; position: relative; padding: 0.25rem 0; transition: color 0.3s;
        }
        .nav-link::after {
            content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px;
            background: var(--azalea); transition: width 0.3s var(--ease-out);
        }
        .nav-link:hover::after, .nav-link.active::after { width: 100%; }
        .nav-link.active { color: var(--azalea); }
        .nav-link:visited { color: var(--rice); }
        .nav-link:active, .nav-link:focus-visible { background: transparent; color: inherit; -webkit-tap-highlight-color: transparent; }
        .nav-link:focus { outline: none; }
        .lang-switch { display: flex; gap: 0.5rem; align-items: center; }
        .lang-btn {
            font-family: var(--font-body); font-size: 0.75rem; padding: 0.3rem 0.6rem;
            border: 1px solid var(--rice); background: transparent; color: var(--rice);
            cursor: pointer; border-radius: 3px; transition: all 0.2s;
        }
        .lang-btn:hover, .lang-btn.active { background: var(--rice); color: var(--ink-deep); }
        @media (max-width: 768px) { .nav .lang-switch { display: none; } }
        .hamburger {
            display: none; flex-direction: column; justify-content: center; gap: 5px;
            width: 28px; height: 28px; cursor: pointer; background: none; border: none;
            padding: 0; z-index: 1001;
        }
        .hamburger span { display: block; width: 100%; height: 2px; background: var(--rice); transition: all 0.3s var(--ease-out); }
        .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(4.5px, 4.5px); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(4.5px, -4.5px); }
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-links { display: none; }
        }
        .mobile-nav {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(26,60,52,0.96); backdrop-filter: blur(30px);
            z-index: 1001; flex-direction: column; justify-content: center;
            align-items: center; gap: 2rem; opacity: 0; visibility: hidden;
            transition: all 0.4s var(--ease-out);
        }
        @media (max-width: 768px) { .mobile-nav { display: flex; } }
        .mobile-nav.open { opacity: 1; visibility: visible; pointer-events: all; }
        .mobile-nav a { font-family: var(--font-serif); font-size: 1.8rem; color: var(--rice); text-decoration: none; transition: color 0.3s; }
        .mobile-nav a:hover, .mobile-nav a.active { color: var(--azalea); }
        .mobile-nav a:visited { color: var(--azalea); }
        .mobile-nav a:active { background: transparent; -webkit-tap-highlight-color: transparent; }
        .mobile-nav a:focus { outline: none; }
        .mobile-nav-close {
            position: absolute; top: 1.5rem; right: 1.5rem; width: 40px; height: 40px;
            border: none; background: rgba(245,240,232,0.1); border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: var(--rice); transition: all 0.3s;
        }
        .mobile-nav-close:hover { background: var(--azalea); color: white; }
        .mobile-lang-switch { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .mobile-lang-switch .lang-btn { border-color: var(--rice); color: var(--rice); }
        .mobile-lang-switch .lang-btn:hover, .mobile-lang-switch .lang-btn.active { background: var(--rice); color: var(--ink-deep); }

        /* ===== Hero ===== */
        .hero {
            position: relative; min-height: 55vh;
            display: flex; align-items: center; justify-content: center;
            padding: 120px 2rem 60px; overflow: hidden;
            background: var(--ink-deep);
        }
        .hero-azalea {
            position: absolute; right: 5%; top: 50%; transform: translateY(-50%);
            opacity: 0.04; pointer-events: none;
        }
        .hero-content { text-align: center; position: relative; z-index: 2; }
        .hero-title-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
        @media (min-width: 768px) { .hero-title-wrap { flex-direction: row; gap: 3rem; } }
        .hero-subtitle-kr {
            writing-mode: vertical-rl; font-family: var(--font-serif-kr); font-size: 2rem;
            color: var(--rice-dim); letter-spacing: 0.3em; opacity: 0.4;
        }
        .hero-title-zh {
            font-family: var(--font-serif); font-size: clamp(2.5rem, 6vw, 4rem);
            color: var(--rice); letter-spacing: 0.15em;
        }
        .hero-seal { width: 90px; height: 90px; opacity: 0.8; }
        .hero-desc {
            font-family: var(--font-sans); font-size: 1rem; color: var(--rice-dim);
            margin-top: 1.5rem; letter-spacing: 2px;
        }

        /* ===== Category Filter ===== */
        .filter-section {
            background: var(--ink); padding: 2.5rem 2rem;
            display: flex; justify-content: center; flex-wrap: wrap; gap: 0.75rem;
        }
        .filter-btn {
            font-family: var(--font-sans); font-size: 0.85rem;
            padding: 0.5rem 1.2rem; border: 1px solid rgba(245,240,232,0.2);
            background: transparent; color: var(--rice-dim); border-radius: 20px;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
        }
        .filter-btn:hover { border-color: var(--gold); color: var(--gold-light); }
        .filter-btn.active {
            background: var(--gold); color: var(--ink-deep);
            border-color: var(--gold); font-weight: 700;
        }

        /* ===== Recipe Grid ===== */
        .recipes-section {
            background: var(--rice); padding: 4rem 2rem;
        }
        .recipes-grid {
            max-width: 1100px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }
        .recipe-card {
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 2px 20px rgba(26,60,52,0.06);
            transition: all 0.4s var(--ease-out); cursor: pointer;
        }
        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(26,60,52,0.12);
        }
        .recipe-img {
            width: 100%; height: 200px; background: var(--ink-deep);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        .recipe-img-placeholder {
            font-size: 3.5rem; opacity: 1;
        }
        .recipe-tag {
            position: absolute; top: 12px; left: 12px;
            background: var(--seal); color: white;
            font-size: 0.7rem; padding: 3px 10px; border-radius: 10px;
            font-family: var(--font-sans); letter-spacing: 1px;
        }
        .recipe-time {
            position: absolute; bottom: 12px; right: 12px;
            background: rgba(15,36,32,0.8); color: var(--rice-dim);
            font-size: 0.7rem; padding: 3px 10px; border-radius: 10px;
            font-family: var(--font-sans); backdrop-filter: blur(8px);
        }
        .recipe-body { padding: 1.5rem; }
        .recipe-title {
            font-family: var(--font-serif); font-size: 1.15rem; color: var(--ink);
            margin-bottom: 0.5rem; line-height: 1.4;
        }
        .recipe-subtitle {
            font-family: var(--font-sans); font-size: 0.8rem; color: var(--brown-light);
            margin-bottom: 0.75rem;
        }
        .recipe-desc {
            font-family: var(--font-sans); font-size: 0.85rem; color: #5A5A5A;
            line-height: 1.7; margin-bottom: 1rem;
        }
        .recipe-meta {
            display: flex; gap: 1rem; flex-wrap: wrap;
        }
        .recipe-meta-item {
            font-size: 0.75rem; color: var(--brown-light);
            display: flex; align-items: center; gap: 4px;
        }
        .recipe-meta-item svg { opacity: 0.5; }
        .recipe-spice {
            display: flex; gap: 2px; align-items: center;
        }
        .spice-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--rice-deep);
        }
        .spice-dot.active { background: var(--seal); }

        /* ===== Recipe Detail Modal ===== */
        .recipe-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(15,36,32,0.85); backdrop-filter: blur(8px);
            display: none; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .recipe-overlay.open { display: flex; justify-content: center; align-items: flex-start; padding: 2rem; }
        .recipe-detail {
            background: var(--rice); border-radius: 16px;
            max-width: 700px; width: 100%; margin: 2rem auto;
            overflow: hidden; position: relative;
            box-shadow: 0 16px 64px rgba(0,0,0,0.3);
        }
        .recipe-detail-close {
            position: absolute; top: 1rem; right: 1rem; z-index: 10;
            width: 36px; height: 36px; border-radius: 50%;
            border: 1px solid rgba(245,240,232,0.3);
            background: rgba(15,36,32,0.7); color: var(--rice);
            font-size: 1.1rem; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            transition: all 0.3s; backdrop-filter: blur(4px);
        }
        .recipe-detail-close:hover { background: var(--seal); border-color: var(--seal); }
        .recipe-detail-hero {
            height: 320px; background: var(--ink-deep);
            position: relative; overflow: hidden;
        }
        .recipe-carousel { position: relative; width: 100%; height: 100%; }
        .recipe-carousel-slide {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.6s ease, transform 0.6s ease;
            transform: scale(0.96); pointer-events: none;
        }
        .recipe-carousel-slide.active { opacity: 1; transform: scale(1); pointer-events: auto; }
        .recipe-carousel-slide-bg {
            position: absolute; inset: 0;
        }
        .recipe-carousel-emoji {
            font-size: 5rem; position: relative; z-index: 2;
            filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3));
            margin-bottom: 8px;
        }
        .recipe-carousel-label {
            font-size: 0.7rem; letter-spacing: 2px; opacity: 0.4;
            position: relative; z-index: 2; color: var(--rice);
            font-family: var(--font-sans);
        }
        .recipe-carousel-dots {
            position: absolute; bottom: 16px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 8px; z-index: 10;
        }
        .recipe-carousel-dot {
            width: 20px; height: 3px; border-radius: 2px;
            background: rgba(245,240,232,0.15); cursor: pointer;
            transition: all 0.4s;
        }
        .recipe-carousel-dot.active {
            width: 32px; background: rgba(245,240,232,0.5);
        }
        .recipe-carousel-arrows {
            position: absolute; top: 50%; left: 0; right: 0;
            display: flex; justify-content: space-between;
            transform: translateY(-50%); padding: 0 12px;
            z-index: 10; pointer-events: none;
        }
        .recipe-carousel-arrow {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid rgba(245,240,232,0.12);
            background: rgba(0,0,0,0.3); display: flex;
            align-items: center; justify-content: center;
            cursor: pointer; pointer-events: auto;
            transition: all 0.3s; opacity: 0.5;
        }
        .recipe-carousel-arrow:hover {
            opacity: 1; border-color: rgba(245,240,232,0.3);
            background: rgba(0,0,0,0.5);
        }
        .recipe-carousel-arrow svg {
            width: 12px; height: 12px; stroke: var(--rice);
            stroke-width: 2; fill: none;
        }
        .recipe-detail-content { padding: 2rem; }
        .recipe-detail-content h2 {
            font-family: var(--font-serif); font-size: 1.5rem; color: var(--ink);
            margin-bottom: 0.5rem;
        }
        .recipe-detail-content .detail-subtitle {
            font-size: 0.85rem; color: var(--brown-light); margin-bottom: 1.5rem;
        }
        .recipe-detail-content h3 {
            font-family: var(--font-serif); font-size: 1.1rem; color: var(--ink);
            margin: 1.5rem 0 0.75rem; padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--rice-deep);
        }
        .recipe-detail-content ul {
            list-style: none; padding: 0;
        }
        .recipe-detail-content ul li {
            font-family: var(--font-sans); font-size: 0.9rem; color: #4A4A4A;
            padding: 0.4rem 0; padding-left: 1.2rem; position: relative;
            line-height: 1.6;
        }
        .recipe-detail-content ul li::before {
            content: ''; position: absolute; left: 0; top: 0.75rem;
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--azalea);
        }
        .recipe-detail-content ol {
            padding-left: 1.5rem;
        }
        .recipe-detail-content ol li {
            font-family: var(--font-sans); font-size: 0.9rem; color: #4A4A4A;
            padding: 0.5rem 0; line-height: 1.7;
        }
        .recipe-tip {
            background: rgba(184,134,11,0.08); border-left: 3px solid var(--gold);
            padding: 1rem 1.2rem; margin-top: 1.5rem; border-radius: 0 8px 8px 0;
        }
        .recipe-tip p {
            font-family: var(--font-sans); font-size: 0.85rem; color: var(--brown-light);
            line-height: 1.6;
        }
        .recipe-cta {
            text-align: center; margin-top: 2rem; padding-top: 1.5rem;
            border-top: 1px solid var(--rice-deep);
        }
        .recipe-cta a {
            display: inline-block; padding: 0.8rem 2rem;
            background: var(--seal); color: white; text-decoration: none;
            border-radius: 4px; font-family: var(--font-sans); font-size: 0.9rem;
            letter-spacing: 2px; transition: background 0.3s;
        }
        .recipe-cta a:hover { background: var(--seal-dark); }

        /* ===== Recipe Video Section ===== */
        .recipe-video-section {
            margin-top: 2rem; padding-top: 1.5rem;
            border-top: 1px solid var(--rice-deep);
        }
        .recipe-video-header {
            display: flex; align-items: center; gap: 0.6rem;
            margin-bottom: 1rem;
        }
        .recipe-video-header-icon {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, var(--seal) 0%, var(--seal-dark) 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(200,16,46,0.25);
        }
        .recipe-video-header-icon svg {
            width: 12px; height: 12px; fill: white; margin-left: 1px;
        }
        .recipe-video-title {
            font-family: var(--font-serif); font-size: 1.05rem; color: var(--ink);
            letter-spacing: 2px;
        }
        .recipe-video-title-sub {
            font-size: 0.7rem; color: var(--brown-light); margin-left: 0.5rem;
            letter-spacing: 1px;
        }
        .recipe-video-player {
            position: relative; width: 100%;
            aspect-ratio: 16 / 9; border-radius: 12px;
            overflow: hidden; cursor: pointer;
            background: linear-gradient(145deg, #0F2420 0%, #1A3C34 40%, #0F2420 100%);
            box-shadow: 0 4px 24px rgba(26,60,52,0.2), inset 0 0 80px rgba(0,0,0,0.15);
        }
        .recipe-video-player::before {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 50% 50%, rgba(196,114,127,0.06) 0%, transparent 70%),
                radial-gradient(ellipse 80% 60% at 30% 40%, rgba(184,134,11,0.04) 0%, transparent 60%);
            pointer-events: none;
        }
        .recipe-video-border {
            position: absolute; inset: 0; border-radius: 12px;
            border: 1px solid rgba(184,134,11,0.15);
            pointer-events: none; z-index: 3;
        }
        .recipe-video-film-grain {
            position: absolute; inset: 0; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 2;
        }
        .recipe-video-play-btn {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 68px; height: 68px; border-radius: 50%;
            background: rgba(200,16,46,0.9);
            border: 2px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            z-index: 5; transition: all 0.4s var(--ease-out);
            box-shadow: 0 0 0 0 rgba(200,16,46,0.4), 0 4px 20px rgba(0,0,0,0.3);
            animation: video-pulse 2.5s ease-in-out infinite;
        }
        .recipe-video-play-btn svg {
            width: 24px; height: 24px; fill: white; margin-left: 3px;
        }
        .recipe-video-play-btn:hover {
            transform: translate(-50%, -50%) scale(1.08);
            background: var(--seal);
            box-shadow: 0 0 0 0 rgba(200,16,46,0.4), 0 6px 28px rgba(0,0,0,0.4);
        }
        @keyframes video-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(200,16,46,0.4), 0 4px 20px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 0 0 12px rgba(200,16,46,0), 0 4px 20px rgba(0,0,0,0.3); }
        }
        .recipe-video-text-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 2.5rem 1.5rem 1.2rem; z-index: 4;
            background: linear-gradient(to top, rgba(15,36,32,0.9) 0%, transparent 100%);
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .recipe-video-recipe-name {
            font-family: var(--font-serif); font-size: 0.9rem; color: var(--rice);
            letter-spacing: 1px; opacity: 0.85;
        }
        .recipe-video-duration {
            font-family: var(--font-sans); font-size: 0.7rem; color: var(--rice-dim);
            background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 4px;
            letter-spacing: 1px; backdrop-filter: blur(4px);
        }
        .recipe-video-corner-tl,
        .recipe-video-corner-tr,
        .recipe-video-corner-bl,
        .recipe-video-corner-br {
            position: absolute; width: 20px; height: 20px; z-index: 4;
            pointer-events: none;
        }

    function t(key) {
        return (translations[currentLang] && translations[currentLang][key]) || translations['zh'][key] || key;
    }

    function getRecipeText(r) {
        var lang = currentLang;
        return r[lang] || r['zh'] || r['en'] || {};
    }

    function renderCards() {
        var grid = document.getElementById('recipesGrid');
        if (!grid) return;
        grid.innerHTML = '';
        var filtered = currentFilter === 'all' ? recipes : recipes.filter(function(r) { return r.cat === currentFilter; });
        filtered.forEach(function(r) {
            var txt = getRecipeText(r);
            var spiceHtml = '';
            for (var i = 0; i < 3; i++) {
                spiceHtml += '<span class="spice-dot' + (i < r.spice ? ' active' : '') + '"></span>';
            }
            var card = document.createElement('div');
            card.className = 'recipe-card reveal';
            card.setAttribute('data-id', r.id);
            card.innerHTML =
                '<div class="recipe-img">' +
                    '<div class="recipe-img-placeholder">' + r.emoji + '</div>' +
                    '<div class="recipe-tag">' + t('filter.' + r.cat) + '</div>' +
                    '<div class="recipe-time">' + r.time + '</div>' +
                '</div>' +
                '<div class="recipe-body">' +
                    '<div class="recipe-title">' + txt.title + '</div>' +
                    '<div class="recipe-subtitle">' + txt.subtitle + '</div>' +
                    '<div class="recipe-desc">' + txt.desc + '</div>' +
                    '<div class="recipe-meta">' +
                        '<div class="recipe-meta-item"><svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8"/><path d="M10 5v5l3 2"/></svg> ' + r.time + '</div>' +
                        '<div class="recipe-meta-item"><svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h14M3 10h14M3 14h14"/></svg> ' + r.servings + '</div>' +
                        '<div class="recipe-meta-item"><svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2l2 6h6l-5 4 2 6-5-4-5 4 2-6-5-4h6z"/></svg> <span class="recipe-spice">' + spiceHtml + '</span></div>' +
                    '</div>' +
                '</div>';
            card.addEventListener('click', function() { openDetail(r); });
            grid.appendChild(card);
        });
        // Trigger reveal
        setTimeout(function() {
            document.querySelectorAll('.recipe-card.reveal').forEach(function(el) { el.classList.add('visible'); });
        }, 100);
    }

    // Carousel logic
    var _carouselIdx = 0;
    var _carouselTimer = null;

    function _updateCarousel() {
        document.querySelectorAll('.recipe-carousel-slide').forEach(function(s, i) {
            s.classList.toggle('active', i === _carouselIdx);
        });
        document.querySelectorAll('.recipe-carousel-dot').forEach(function(d, i) {
            d.classList.toggle('active', i === _carouselIdx);
        });
    }

    function _stopCarouselTimer() {
        if (_carouselTimer) { clearInterval(_carouselTimer); _carouselTimer = null; }
    }

    function _carouselGo(idx) {
        _carouselIdx = idx;
        _updateCarousel();
        _stopCarouselTimer();
        _carouselTimer = setInterval(function() {
            _carouselIdx = (_carouselIdx + 1) % 3;
            _updateCarousel();
        }, 3500);
    }

    document.getElementById('carouselPrev').addEventListener('click', function() {
        _carouselGo((_carouselIdx - 1 + 3) % 3);
    });
    document.getElementById('carouselNext').addEventListener('click', function() {
        _carouselGo((_carouselIdx + 1) % 3);
    });
    document.querySelectorAll('.recipe-carousel-dot').forEach(function(dot) {
        dot.addEventListener('click', function() {
            _carouselGo(parseInt(dot.dataset.cslide));
        });
    });

    function openDetail(r) {
        var txt = getRecipeText(r);
        var zh = r.zh || r.en || {};
        var overlay = document.getElementById('recipeOverlay');
        var hero = document.getElementById('detailHero');
        var content = document.getElementById('detailContent');
        // Populate carousel with recipe data
        var scenes = [
            { emoji: r.emoji || '\uD83C\uDF72', label: t('carousel.result') || '\u6210\u54C1\u5C55\u793A', bg: 'linear-gradient(135deg, #1A3C34 0%, #0F2420 100%)' },
            { emoji: r.ingredientEmoji || '\uD83E\uDD6C', label: t('carousel.ingredient') || '\u98DF\u6750\u7279\u5199', bg: 'linear-gradient(135deg, #2A5A4E 0%, #1A3C34 100%)' },
            { emoji: r.cookEmoji || '\uD83D\uDD25', label: t('carousel.cooking') || '\u5236\u4F5C\u8FC7\u7A0B', bg: 'linear-gradient(135deg, #3D2B1F 0%, #1A3C34 100%)' }
        ];
        scenes.forEach(function(s, i) {
            var slide = document.querySelector('.recipe-carousel-slide[data-slide="' + i + '"]');
            if (slide) {
                slide.querySelector('.recipe-carousel-emoji').textContent = s.emoji;
                slide.querySelector('.recipe-carousel-label').textContent = s.label;
                slide.querySelector('.recipe-carousel-slide-bg').style.background = s.bg;
            }
        });
        // Reset carousel to first slide
        _carouselIdx = 0;
        _updateCarousel();
        // Start auto-rotate
        _stopCarouselTimer();
        _carouselTimer = setInterval(function() {
            _carouselIdx = (_carouselIdx + 1) % 3;
            _updateCarousel();
        }, 3500);

        var html = '<h2>' + txt.title + '</h2>';
        html += '<div class="detail-subtitle">' + txt.subtitle + ' \u00B7 ' + r.time + ' \u00B7 ' + r.servings + '</div>';

        html += '<h3>' + t('detail.ingredients') + '</h3><ul>';
        (zh.ingredients || []).forEach(function(item) { html += '<li>' + item + '</li>'; });
        html += '</ul>';

        html += '<h3>' + t('detail.steps') + '</h3><ol>';
        (zh.steps || []).forEach(function(step) { html += '<li>' + step + '</li>'; });
        html += '</ol>';

        if (zh.tip) {
            html += '<div class="recipe-tip"><p>' + zh.tip + '</p></div>';
        }

        // Video section
        html += '<div class="recipe-video-section">';
        html += '<div class="recipe-video-header">';
        html += '<div class="recipe-video-header-icon"><svg viewBox="0 0 12 14"><polygon points="0,0 12,7 0,14"/></svg></div>';
        html += '<span class="recipe-video-title">' + t('detail.video') + '</span>';
        html += '<span class="recipe-video-title-sub">' + t('detail.videoSub') + '</span>';
        html += '</div>';
        html += '<div class="recipe-video-player" onclick="this.classList.toggle(\'playing\')">';
        html += '<div class="recipe-video-border"></div>';
        html += '<div class="recipe-video-film-grain"></div>';
        html += '<div class="recipe-video-corner-tl"></div>';
        html += '<div class="recipe-video-corner-tr"></div>';
        html += '<div class="recipe-video-corner-bl"></div>';
        html += '<div class="recipe-video-corner-br"></div>';
        html += '<div class="recipe-video-play-btn"><svg viewBox="0 0 24 24"><polygon points="8,5 20,12 8,19"/></svg></div>';
        html += '<div class="recipe-video-text-overlay">';
        html += '<div class="recipe-video-recipe-name">' + txt.title + '</div>';
        html += '<div class="recipe-video-duration">' + t('detail.videoDuration') + '</div>';
        html += '</div>';
        html += '<div class="recipe-video-placeholder-text">' + t('detail.videoComing') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="recipe-cta"><a href="products.html">' + t('detail.cta') + '</a></div>';

        content.innerHTML = html;
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
        _stopCarouselTimer();
        var overlay = document.getElementById('recipeOverlay');
        overlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    // Init
    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('hailanzu-lang', lang);
        document.querySelectorAll('[data-i18n]').forEach(function(el) {
            var key = el.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) {
                el.textContent = translations[lang][key];
            }
        });
        document.querySelectorAll('.lang-btn').forEach(function(btn) {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });
        document.documentElement.lang = lang;
        renderCards();
    }

    // Nav & hamburger
    var hamburger = document.getElementById('hamburger');
    var mobileNav = document.getElementById('mobileNav');
    var nav = document.getElementById('nav');
    var mobileNavClose = document.getElementById('mobileNavClose');

    hamburger.addEventListener('click', function() {
        hamburger.classList.toggle('open');
        mobileNav.classList.toggle('open');
        document.body.style.overflow = mobileNav.classList.contains('open') ? 'hidden' : '';
    });
    mobileNavClose.addEventListener('click', function() {
        hamburger.classList.remove('open');
        mobileNav.classList.remove('open');
        document.body.style.overflow = '';
    });
    mobileNav.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
            hamburger.classList.remove('open');
            mobileNav.classList.remove('open');
            document.body.style.overflow = '';
        });
    });
    window.addEventListener('scroll', function() {
        nav.classList.toggle('scrolled', window.scrollY > 50);
    });

    // Language switch
    document.querySelectorAll('.lang-btn').forEach(function(btn) {
        btn.addEventListener('click', function() { setLanguage(btn.dataset.lang); });
    });

    // Filter
    document.querySelectorAll('.filter-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderCards();
        });
    });

    // Detail close
    document.getElementById('recipeDetailClose').addEventListener('click', closeDetail);
    document.getElementById('recipeOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeDetail();
    });

    // Reveal observer
    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });
    document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });

    // Boot
    if (!localStorage.getItem('hailanzu-lang')) {
        var bl = navigator.language.slice(0, 2);
        currentLang = ['zh','ko','en','ja'].includes(bl) ? bl : 'zh';
    }
    setLanguage(currentLang);
})();
