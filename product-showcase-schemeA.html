<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海兰菹 · 方案A 品类中枢（10系列版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1A3C34;--seal:#C8102E;--azalea:#C4727F;--rice:#F5F0E8;--gold:#B8860B;--ink-deep:#0d1f1a}
body{background:#0a0a0a;color:var(--rice);font-family:-apple-system,"Noto Serif SC",serif;overflow-x:hidden}
.page-header{text-align:center;padding:48px 24px 8px;letter-spacing:10px;font-size:18px;font-weight:600}
.page-sub{text-align:center;font-size:12px;opacity:.3;letter-spacing:4px;margin-bottom:48px}

.scene{max-width:1400px;margin:0 auto;padding:0 24px 80px}
.gallery{width:100%;height:80vh;min-height:560px;background:var(--ink-deep);border-radius:16px;overflow:hidden;border:1px solid rgba(245,240,232,.06);display:flex}

/* Sidebar */
.sidebar{width:220px;flex-shrink:0;border-right:1px solid rgba(245,240,232,.04);display:flex;flex-direction:column;padding:16px 0;overflow-y:auto}
.sidebar-title{font-size:9px;letter-spacing:4px;color:var(--gold);opacity:.5;padding:0 20px;margin-bottom:12px}
.side-item{padding:10px 20px;font-size:11px;letter-spacing:2px;color:rgba(245,240,232,.35);cursor:pointer;position:relative;transition:all .3s;display:flex;align-items:center;gap:8px}
.side-item:hover{color:rgba(245,240,232,.6);background:rgba(245,240,232,.02)}
.side-item.active{color:var(--rice);background:rgba(245,240,232,.04)}
.side-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:60%;border-radius:1px}
.side-icon{font-size:14px;opacity:.5}
.side-kr{font-size:8px;opacity:.3;margin-left:auto;letter-spacing:1px}
.side-count{font-size:8px;color:var(--gold);opacity:.4;margin-left:6px}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-head{padding:20px 24px 12px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid rgba(245,240,232,.04)}
.main-title-group{}
.main-title{font-size:20px;letter-spacing:6px;font-weight:600}
.main-kr{font-size:11px;opacity:.2;letter-spacing:3px;margin-top:2px}
.main-tagline{font-size:11px;opacity:.4;margin-top:4px;max-width:400px}
.main-count{font-size:10px;opacity:.3;letter-spacing:2px}

/* Line tabs */
.line-tabs{padding:12px 24px 0;display:flex;gap:6px}
.line-tab{padding:4px 12px;border-radius:3px;font-size:9px;letter-spacing:2px;cursor:pointer;transition:all .3s;border:1px solid rgba(245,240,232,.06);opacity:.4}
.line-tab.active{opacity:1;border-color:rgba(245,240,232,.15);background:rgba(245,240,232,.04)}
.line-tab:hover{opacity:.6}

/* Grid */
.grid-wrap{flex:1;padding:16px 24px 20px;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{border-radius:10px;overflow:hidden;position:relative;aspect-ratio:1/1.15;cursor:pointer;transition:transform .3s}
.card:hover{transform:translateY(-2px)}
.card-bg{position:absolute;inset:0}
.card-icon{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:50%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(245,240,232,.12)}
.card-tag{position:absolute;top:8px;right:8px;padding:2px 7px;border-radius:2px;font-size:7px;letter-spacing:1px;background:rgba(0,0,0,.3);opacity:.5}
.card-info{position:absolute;bottom:0;left:0;right:0;padding:10px;text-align:center}
.card-name{font-size:10px;letter-spacing:1.5px;font-weight:600;margin-bottom:2px}
.card-kr{font-size:7px;opacity:.25;letter-spacing:1px;margin-bottom:2px}
.card-spec{font-size:7px;opacity:.2;letter-spacing:.5px;margin-bottom:4px}
.card-spice{display:flex;gap:2px;justify-content:center}
.card-spice span{width:4px;height:4px;border-radius:50%;background:rgba(245,240,232,.1)}
.card-spice span.on{background:var(--seal)}
/* Light bg */
.card.light .card-name{color:var(--ink)}
.card.light .card-kr{color:rgba(26,60,52,.3)}
.card.light .card-spec{color:rgba(26,60,52,.2)}
.card.light .card-tag{background:rgba(0,0,0,.06);color:var(--ink)}
.card.light .card-spice span{background:rgba(26,60,52,.1)}
.card.light .card-spice span.on{background:var(--seal)}
</style>
</head>

let curS=0,curL=0;
function cnt(s){if(s.lines&&s.lines.length){let t=0;s.lines.forEach(l=>t+=l.products.length);return t}return(s.products||[]).length}
function adj(hex,a){hex=hex.replace('#','');let r=Math.min(255,Math.max(0,parseInt(hex.substr(0,2),16)+a)),g=Math.min(255,Math.max(0,parseInt(hex.substr(2,2),16)+a)),b=Math.min(255,Math.max(0,parseInt(hex.substr(4,2),16)+a));return '#'+[r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('')}
function sd(n,l){let s='';for(let i=0;i<5;i++)s+='<span'+(i<l?' class="on"':'')+'></span>';return s}

function renderSidebar(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML='<div class="sidebar-title">系 列</div>';
  SERIES.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='side-item'+(i===curS?' active':'');
    d.innerHTML=`<span class="side-icon">${s.icon}</span>${s.name}<span class="side-kr">${s.kr}</span><span class="side-count">${cnt(s)}</span>`;
    if(i===curS)d.querySelector('.side-item').style.setProperty('--c',s.color);
    d.style.setProperty('--sc',s.color);
    if(i===curS){const bf=d.querySelector('::before')||d;d.style.cssText+='border-left-color:'+s.color}
    d.onclick=()=>{curS=i;curL=0;renderSidebar();renderMain()};
    sb.appendChild(d);
  });
  // fix active border
  document.querySelectorAll('.side-item').forEach((el,i)=>{
    if(i===curS){el.style.borderLeft='';const s=SERIES[i];el.style.setProperty('border-left','2px solid '+s.color)}
  });
}

function renderMain(){
  const s=SERIES[curS];
  const m=document.getElementById('main');
  let prods,cardColor;
  if(s.lines&&s.lines.length){
    const line=s.lines[curL]||s.lines[0];
    prods=line.products;cardColor=line.color;
  } else {
    prods=s.products;cardColor=s.color;
  }
  let ltHtml='';
  if(s.lines&&s.lines.length){
    s.lines.forEach((l,i)=>{
      ltHtml+=`<div class="line-tab${i===curL?' active':''}" onclick="curL=${i};renderMain()" style="${i===curL?'border-color:'+l.color+';':''}">${l.name} ${l.nameKr}</div>`;
    });
  }
  let gridHtml='';
  prods.forEach((p,i)=>{
    const bg=`linear-gradient(150deg,${adj(cardColor,-30+i*5)},${adj(cardColor,-50+i*5)})`;
    gridHtml+=`<div class="card${s.light?' light':''}"><div class="card-bg" style="background:${bg}"></div><div class="card-icon">${s.icon}</div><div class="card-tag">${p.tag}</div><div class="card-info"><div class="card-name">${p.name}</div><div class="card-kr">${p.kr}</div><div class="card-spec">${p.spec}</div><div class="card-spice">${sd(5,p.spice)}</div></div></div>`;
  });
  m.innerHTML=`<div class="main-head"><div class="main-title-group"><div class="main-title">${s.name}</div><div class="main-kr">${s.kr}</div><div class="main-tagline">${s.tagline}</div></div><div class="main-count">${cnt(s)} 款产品</div></div>${ltHtml?'<div class="line-tabs">'+ltHtml+'</div>':''}<div class="grid-wrap"><div class="grid">${gridHtml}</div></div>`;
}

renderSidebar();renderMain();
