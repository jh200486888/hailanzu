<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">

<title>海兰菹 · 方案D 分屏滚动（10系列版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1A3C34;--seal:#C8102E;--rice:#F5F0E8;--gold:#B8860B;--ink-deep:#0d1f1a}
body{background:#0a0a0a;color:var(--rice);font-family:-apple-system,"Noto Serif SC",serif;overflow-x:hidden}
.page-header{text-align:center;padding:48px 24px 8px;letter-spacing:10px;font-size:18px;font-weight:600}
.page-sub{text-align:center;font-size:12px;opacity:.3;letter-spacing:4px;margin-bottom:48px}

.scene{max-width:1400px;margin:0 auto;padding:0 24px 80px}
.gallery{width:100%;height:80vh;min-height:560px;background:var(--ink-deep);border-radius:16px;overflow:hidden;border:1px solid rgba(245,240,232,.06);position:relative}

/* Section layout */
.section{display:flex;height:100%}
.sec-left{width:30%;padding:40px 32px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid rgba(245,240,232,.06)}
.sec-cat{font-size:9px;letter-spacing:5px;color:var(--gold);opacity:.5;margin-bottom:10px}
.sec-title{font-size:28px;letter-spacing:6px;font-weight:700;margin-bottom:4px;line-height:1.3}
.sec-kr{font-size:12px;opacity:.2;letter-spacing:3px;margin-bottom:14px}
.sec-tagline{font-size:11px;opacity:.45;line-height:1.7;margin-bottom:16px;max-width:280px}
.sec-line{width:32px;height:1px;background:rgba(245,240,232,.1);margin-bottom:16px}
.sec-culture{font-size:9px;opacity:.3;line-height:1.8;margin-bottom:16px;max-width:280px}
.sec-count{font-size:10px;color:var(--gold);opacity:.4;letter-spacing:3px}

/* Line tabs in section */
.sec-tabs{display:flex;gap:6px;margin-top:16px}
.sec-tab{padding:4px 12px;border-radius:3px;font-size:9px;letter-spacing:2px;cursor:pointer;transition:all .3s;border:1px solid rgba(245,240,232,.06);opacity:.4}
.sec-tab.active{opacity:1;border-color:rgba(245,240,232,.15);background:rgba(245,240,232,.04)}
.sec-tab:hover{opacity:.6}

/* Right grid */
.sec-right{flex:1;padding:20px;overflow-y:auto;display:flex;align-items:center}
.sec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.sec-card{border-radius:10px;overflow:hidden;position:relative;aspect-ratio:1/1.15;cursor:pointer;transition:transform .3s}
.sec-card:hover{transform:translateY(-2px)}
.sec-card-bg{position:absolute;inset:0}
.sec-card-icon{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:50%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(245,240,232,.12)}
.sec-card-tag{position:absolute;top:8px;right:8px;padding:2px 6px;border-radius:2px;font-size:7px;letter-spacing:1px;background:rgba(0,0,0,.3);opacity:.5}
.sec-card-info{position:absolute;bottom:0;left:0;right:0;padding:8px;text-align:center}
.sec-card-name{font-size:10px;letter-spacing:1.5px;font-weight:600;margin-bottom:1px}
.sec-card-kr{font-size:7px;opacity:.25;letter-spacing:1px;margin-bottom:1px}
.sec-card-spec{font-size:7px;opacity:.2;margin-bottom:3px}
.sec-card-spice{display:flex;gap:2px;justify-content:center}
.sec-card-spice span{width:4px;height:4px;border-radius:50%;background:rgba(245,240,232,.1)}
.sec-card-spice span.on{background:var(--seal)}
/* Light */
.sec-card.light .sec-card-name{color:var(--ink)}
.sec-card.light .sec-card-kr{color:rgba(26,60,52,.3)}
.sec-card.light .sec-card-spec{color:rgba(26,60,52,.2)}
.sec-card.light .sec-card-tag{background:rgba(0,0,0,.06);color:var(--ink)}
.sec-card.light .sec-card-spice span{background:rgba(26,60,52,.1)}
.sec-card.light .sec-card-spice span.on{background:var(--seal)}

/* Bottom nav */
.nav-bar{position:absolute;bottom:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:center;gap:5px;z-index:5;background:linear-gradient(transparent,rgba(13,31,26,.9))}
.nav-dot{width:20px;height:2px;border-radius:1px;background:rgba(245,240,232,.1);cursor:pointer;transition:all .3s}
.nav-dot.active{width:36px;background:var(--gold)}

/* Scroll hint */
.scroll-hint{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:8px;letter-spacing:3px;opacity:.15;writing-mode:vertical-rl}

/* Section label */
.sec-label{position:absolute;bottom:14px;left:30%;font-size:8px;letter-spacing:3px;opacity:.2;z-index:5}
</style>
</head>

let cur=0,curL=0;
function cnt(s){if(s.lines&&s.lines.length){let t=0;s.lines.forEach(l=>t+=l.products.length);return t}return(s.products||[]).length}
function adj(hex,a){hex=hex.replace('#','');let r=Math.min(255,Math.max(0,parseInt(hex.substr(0,2),16)+a)),g=Math.min(255,Math.max(0,parseInt(hex.substr(2,2),16)+a)),b=Math.min(255,Math.max(0,parseInt(hex.substr(4,2),16)+a));return '#'+[r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('')}
function sd(n,l){let s='';for(let i=0;i<5;i++)s+='<span'+(i<l?' class="on"':'')+'></span>';return s}

function render(idx){
  cur=idx;curL=0;
  const s=SERIES[idx];
  let prods,cc;
  if(s.lines&&s.lines.length){const l=s.lines[0];prods=l.products;cc=l.color}else{prods=s.products;cc=s.color}
  
  let tabsH='';
  if(s.lines&&s.lines.length){
    s.lines.forEach((l,i)=>{tabsH+=`<div class="sec-tab${i===0?' active':''}" onclick="switchLine(${i})" style="${i===0?'border-color:'+l.color:''}">${l.name} ${l.nameKr}</div>`});
  }
  
  let gridH='';
  prods.forEach((p,i)=>{
    const bg=`linear-gradient(150deg,${adj(cc,-30+i*5)},${adj(cc,-50+i*5)})`;
    gridH+=`<div class="sec-card${s.light?' light':''}"><div class="sec-card-bg" style="background:${bg}"></div><div class="sec-card-icon">${s.icon}</div><div class="sec-card-tag">${p.tag}</div><div class="sec-card-info"><div class="sec-card-name">${p.name}</div><div class="sec-card-kr">${p.kr}</div><div class="sec-card-spec">${p.spec}</div><div class="sec-card-spice">${sd(5,p.spice)}</div></div></div>`;
  });

  document.getElementById('content').innerHTML=`<div class="section"><div class="sec-left" style="background:${adj(s.color,-40)}"><div class="sec-cat">系列 ${String(idx+1).padStart(2,'0')}</div><div class="sec-title">${s.name}</div><div class="sec-kr">${s.kr}</div><div class="sec-tagline">${s.tagline}</div><div class="sec-line"></div><div class="sec-culture">${s.culture}</div><div class="sec-count">${cnt(s)} 款产品</div>${tabsH?'<div class="sec-tabs">'+tabsH+'</div>':''}</div><div class="sec-right"><div class="sec-grid">${gridH}</div></div></div>`;
  
  renderNav();
  document.getElementById('label').textContent=String(idx+1).padStart(2,'0')+' / 10 系列';
}

function switchLine(li){
  curL=li;
  const s=SERIES[cur];
  const l=s.lines[li];
  const right=document.querySelector('.sec-right .sec-grid');
  let gridH='';
  l.products.forEach((p,i)=>{
    const bg=`linear-gradient(150deg,${adj(l.color,-30+i*5)},${adj(l.color,-50+i*5)})`;
    gridH+=`<div class="sec-card${s.light?' light':''}"><div class="sec-card-bg" style="background:${bg}"></div><div class="sec-card-icon">${s.icon}</div><div class="sec-card-tag">${p.tag}</div><div class="sec-card-info"><div class="sec-card-name">${p.name}</div><div class="sec-card-kr">${p.kr}</div><div class="sec-card-spec">${p.spec}</div><div class="sec-card-spice">${sd(5,p.spice)}</div></div></div>`;
  });
  right.innerHTML=gridH;
  document.querySelectorAll('.sec-tab').forEach((t,i)=>{t.className='sec-tab'+(i===li?' active':'');t.style.borderColor=i===li?l.color:''});
}

function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML='';
  SERIES.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='nav-dot'+(i===cur?' active':'');
    d.style.background=i===cur?s.color:'';
    d.onclick=()=>render(i);
    d.title=s.name;
    nav.appendChild(d);
  });
}

render(0);
</script>
</body>
</html>
