<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Story Nav</title>
    <style>
        :root {
            --ink: #1A3C34;
            --rice: #F5F0E8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }
        body {
            font-family: sans-serif;
            background: var(--rice);
            color: var(--ink);
        }
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            background: rgba(15,36,32,0.95);
        }
        .nav-logo { color: var(--rice); text-decoration: none; font-weight: bold; font-size: 1.2rem; }
        .nav-links { display: none; }
        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            z-index: 1001;
        }
        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background: var(--rice);
        }
        .mobile-nav {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15,36,32,0.98);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .mobile-nav.open { opacity: 1; visibility: visible; pointer-events: all; }
        .mobile-nav a { color: var(--rice); text-decoration: none; font-size: 1.5rem; }
        .mobile-nav-close {
            position: absolute; top: 1.5rem; right: 1.5rem;
            width: 40px; height: 40px; border: none;
            background: rgba(245,240,232,0.1); border-radius: 50%;
            cursor: pointer; color: var(--rice); font-size: 1.2rem;
        }
        .spacer { height: 200vh; padding: 100px 2rem 2rem; }
        .spacer p { margin-bottom: 2rem; line-height: 1.8; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index-folk.html" class="nav-logo">海兰菹</a>
        <div class="nav-links"><a href="seasons.html">四季</a> <a href="products.html">产品</a></div>
        <button class="hamburger" id="hamburger">
            <span></span><span></span><span></span>
        </button>
    </nav>
    <div class="mobile-nav" id="mobileNav">
        <button class="mobile-nav-close" id="closeNav">✕</button>
        <a href="index-folk.html">首页</a>
        <a href="story.html">延边风土</a>
        <a href="seasons.html">四季发酵</a>
        <a href="products.html">产品殿堂</a>
    </div>
    <div class="spacer">
        <p>测试页面 - 滚动查看导航是否悬浮</p>
        <p>这条线下面是真正story.html的内容（iframe方式加载）</p>
        <iframe src="story-content.html" style="width:100%;height:100vh;border:none;"></iframe>
    </div>
    <script>
        const hamburger = document.getElementById('hamburger');
        const mobileNav = document.getElementById('mobileNav');
        const closeNav = document.getElementById('closeNav');
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('open');
            mobileNav.classList.toggle('open');
        });
        closeNav.addEventListener('click', () => {
            hamburger.classList.remove('open');
            mobileNav.classList.remove('open');
        });
        mobileNav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('open');
                mobileNav.classList.remove('open');
            });
        });
    </script>
</body>
</html>
