<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海兰菹 · 产品殿堂 — 方案C 产品详情演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1A3C34;--seal:#C8102E;--azalea:#C4727F;--rice:#F5F0E8;--gold:#B8860B;--ink-deep:#0d1f1a}
html{overflow-x:hidden;scroll-behavior:smooth}
body{background:#0a0a0a;color:var(--rice);font-family:-apple-system,"Noto Serif SC",serif;overflow-x:hidden}

/* --- Page Header --- */
.page-header{text-align:center;padding:32px 24px 4px;letter-spacing:10px;font-size:18px;font-weight:600}
.page-sub{text-align:center;font-size:11px;opacity:.25;letter-spacing:3px;margin-bottom:4px}
.page-hint{text-align:center;font-size:10px;opacity:.15;letter-spacing:2px;margin-bottom:20px}

/* --- Scroll container --- */
.scroll-wrap{max-width:1400px;margin:0 auto;padding:0 24px 40px}
.scroll-page{height:calc(100vh - 100px);min-height:460px;display:flex;flex-direction:column;gap:12px;scroll-snap-align:start}

/* --- Each series row --- */
.s-row{flex:1;position:relative;background:var(--ink-deep);border-radius:14px;overflow:hidden;border:1px solid rgba(245,240,232,.05);display:flex}

/* Accent bar */
.s-accent{position:absolute;left:0;top:0;width:3px;height:100%;z-index:4}

/* Left Panel */
.s-left{width:26%;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;z-index:3;border-right:1px solid rgba(245,240,232,.06)}
.s-left-title{font-size:24px;letter-spacing:5px;font-weight:700;line-height:1.2}
.s-left-kr{font-size:11px;opacity:.2;letter-spacing:2px;margin-top:3px}

/* Series Tabs */
.s-left-tabs{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.s-left-tab{padding:4px 10px;border-radius:3px;font-size:9px;letter-spacing:1px;cursor:pointer;transition:all .3s;border:1px solid rgba(245,240,232,.08);opacity:.4;text-align:center;line-height:1.4}
.s-left-tab .tab-zh{display:block;font-size:10px;letter-spacing:2px}
.s-left-tab .tab-kr{display:block;font-size:8px;opacity:.5;letter-spacing:1px}
.s-left-tab.active{opacity:1;border-color:rgba(245,240,232,.2);background:rgba(245,240,232,.06)}
.s-left-tab:hover{opacity:.7}

/* Product nav */
.s-left-nav{margin-top:10px;display:flex;align-items:center;gap:6px}
.s-left-nav-btn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(245,240,232,.1);background:transparent;color:var(--rice);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .3s;opacity:.4}
.s-left-nav-btn:hover{opacity:1;border-color:rgba(245,240,232,.3)}
.s-left-nav-counter{font-size:9px;letter-spacing:1px;opacity:.25}

/* Right: product card */
.s-product{width:74%;display:flex;align-items:center;justify-content:center;padding:20px 24px}

.s-card{width:100%;height:100%;border-radius:14px;position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s;cursor:pointer}
.s-card:hover{transform:scale(1.005);box-shadow:0 0 30px rgba(245,240,232,.04)}
.s-card-bg{position:absolute;inset:0;transition:background .5s}
.s-card-img{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:32%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:40px;transition:all .3s}
.s-card-info{position:absolute;bottom:0;left:0;right:0;padding:18px;text-align:center}
.s-card-name{font-size:18px;letter-spacing:4px;font-weight:600;margin-bottom:4px}
.s-card-kr{font-size:11px;opacity:.22;letter-spacing:2px;margin-bottom:5px}
.s-card-spec{font-size:10px;opacity:.2;letter-spacing:1px;margin-bottom:6px}
.s-card-spice{display:flex;gap:4px;justify-content:center}
.s-card-spice span{width:6px;height:6px;border-radius:50%;background:rgba(245,240,232,.1)}
.s-card-spice span.on{background:var(--seal)}
.s-card-tag{position:absolute;top:12px;right:14px;padding:3px 10px;border-radius:3px;font-size:9px;letter-spacing:1px;background:rgba(0,0,0,.3);opacity:.5}
.s-card-cta{position:absolute;top:12px;left:14px;padding:3px 10px;border-radius:3px;font-size:8px;letter-spacing:1px;background:rgba(245,240,232,.08);opacity:0;transition:opacity .3s;border:1px solid rgba(245,240,232,.1)}
.s-card:hover .s-card-cta{opacity:.6}

/* Light background */
.s-card.light-bg .s-card-name{color:var(--ink)}
.s-card.light-bg .s-card-kr{color:rgba(26,60,52,.3)}
.s-card.light-bg .s-card-spec{color:rgba(26,60,52,.3)}
.s-card.light-bg .s-card-tag{background:rgba(0,0,0,.08);color:var(--ink);opacity:.7}
.s-card.light-bg .s-card-spice span{background:rgba(26,60,52,.1)}
.s-card.light-bg .s-card-spice span.on{background:var(--seal)}
.s-card.light-bg .s-card-img{background:rgba(255,255,255,.15)}
.s-card.light-bg .s-card-cta{background:rgba(26,60,52,.08);color:var(--ink);border-color:rgba(26,60,52,.15)}

/* Scroll hint */
.scroll-hint{text-align:center;font-size:9px;letter-spacing:3px;opacity:.12;margin-top:8px}
.scroll-hint::after{content:" ↓";animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

/* =============================================
   PRODUCT DETAIL OVERLAY
   ============================================= */
.detail-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.detail-overlay.open{opacity:1;visibility:visible}

.detail-container{position:absolute;inset:0;display:flex;align-items:stretch;max-width:1200px;margin:0 auto;padding:24px}

/* Close button */
.detail-close{position:absolute;top:20px;right:24px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(245,240,232,.12);background:rgba(245,240,232,.04);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;transition:all .3s}
.detail-close:hover{border-color:rgba(245,240,232,.3);background:rgba(245,240,232,.08)}
.detail-close svg{width:16px;height:16px;stroke:var(--rice);stroke-width:2;fill:none;opacity:.5}

/* Left: Product visual */
.detail-left{width:48%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;position:relative}

.detail-carousel{width:300px;position:relative;margin-bottom:24px}
.detail-carousel-track{position:relative;width:280px;height:280px;margin:0 auto;overflow:hidden;border-radius:50%}
.detail-carousel-slide{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .6s ease,transform .6s ease;transform:scale(.92);pointer-events:none}
.detail-carousel-slide.active{opacity:1;transform:scale(1);pointer-events:auto}
.detail-carousel-bg{position:absolute;inset:0;border-radius:50%}
.detail-carousel-ring{position:absolute;inset:-2px;border-radius:50%;border:1px solid rgba(245,240,232,.08)}
.detail-carousel-glow{position:absolute;inset:-24px;border-radius:50%;opacity:.12;filter:blur(40px)}
.detail-carousel-icon{font-size:72px;position:relative;z-index:2;filter:drop-shadow(0 4px 20px rgba(0,0,0,.3));margin-bottom:4px}
.detail-carousel-label{font-size:9px;letter-spacing:2px;opacity:.35;position:relative;z-index:2;margin-top:6px}

.detail-carousel-dots{display:flex;justify-content:center;gap:8px;margin-top:16px}
.detail-carousel-dot{width:20px;height:3px;border-radius:2px;background:rgba(245,240,232,.12);cursor:pointer;transition:all .4s}
.detail-carousel-dot.active{width:32px;background:rgba(245,240,232,.5)}

.detail-carousel-arrows{position:absolute;top:50%;left:0;right:0;display:flex;justify-content:space-between;transform:translateY(-50%);pointer-events:none;z-index:5;padding:0 4px}
.detail-carousel-arrow{width:28px;height:28px;border-radius:50%;border:1px solid rgba(245,240,232,.1);background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;transition:all .3s;opacity:.4}
.detail-carousel-arrow:hover{opacity:1;border-color:rgba(245,240,232,.3);background:rgba(0,0,0,.5)}
.detail-carousel-arrow svg{width:10px;height:10px;stroke:var(--rice);stroke-width:2;fill:none;opacity:.6}

/* Light carousel variant */
.detail-overlay.light-overlay .detail-carousel-dot{background:rgba(26,60,52,.12)}
.detail-overlay.light-overlay .detail-carousel-dot.active{background:rgba(26,60,52,.45)}
.detail-overlay.light-overlay .detail-carousel-arrow{border-color:rgba(26,60,52,.15);background:rgba(255,255,255,.3)}
.detail-overlay.light-overlay .detail-carousel-arrow svg{stroke:var(--ink)}

.detail-badge{display:flex;align-items:center;gap:6px;margin-top:8px}
.detail-badge-item{padding:4px 12px;border-radius:20px;font-size:10px;letter-spacing:1.5px;border:1px solid rgba(245,240,232,.1);background:rgba(245,240,232,.04)}

.detail-spice-row{display:flex;align-items:center;gap:5px;margin-top:12px}
.detail-spice-label{font-size:9px;letter-spacing:1px;opacity:.25;margin-right:4px}
.detail-spice span{width:8px;height:8px;border-radius:50%;background:rgba(245,240,232,.1)}
.detail-spice span.on{background:var(--seal);box-shadow:0 0 6px rgba(200,16,46,.4)}

/* Right: Product info */
.detail-right{width:52%;display:flex;flex-direction:column;justify-content:center;padding:40px 30px 40px 20px;border-left:1px solid rgba(245,240,232,.06)}

.detail-series{font-size:10px;letter-spacing:3px;opacity:.25;margin-bottom:8px;text-transform:uppercase}
.detail-name{font-size:32px;letter-spacing:6px;font-weight:700;line-height:1.2;margin-bottom:4px}
.detail-name-kr{font-size:14px;letter-spacing:3px;opacity:.2;margin-bottom:20px}

.detail-divider{width:40px;height:1px;background:linear-gradient(90deg,rgba(245,240,232,.2),transparent);margin-bottom:20px}

.detail-desc{font-size:13px;line-height:2;opacity:.55;letter-spacing:.5px;margin-bottom:24px;max-width:420px}
.detail-desc strong{opacity:1;font-weight:600;letter-spacing:1px}

/* Specs grid */
.detail-specs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.detail-spec-item{padding:10px 14px;border-radius:8px;background:rgba(245,240,232,.03);border:1px solid rgba(245,240,232,.05)}
.detail-spec-label{font-size:9px;letter-spacing:2px;opacity:.2;margin-bottom:4px}
.detail-spec-value{font-size:12px;letter-spacing:1px;opacity:.6}

/* CTA */
.detail-cta-row{display:flex;gap:10px;margin-top:8px}
.detail-cta{padding:10px 24px;border-radius:6px;font-size:11px;letter-spacing:2px;cursor:pointer;transition:all .3s;font-family:inherit;border:none}
.detail-cta-primary{background:var(--seal);color:#fff}
.detail-cta-primary:hover{background:#d42038;box-shadow:0 4px 20px rgba(200,16,46,.3)}
.detail-cta-secondary{background:rgba(245,240,232,.06);color:var(--rice);border:1px solid rgba(245,240,232,.1)}
.detail-cta-secondary:hover{background:rgba(245,240,232,.1);border-color:rgba(245,240,232,.2)}

/* Related products */
.detail-related{margin-top:28px;padding-top:20px;border-top:1px solid rgba(245,240,232,.06)}
.detail-related-title{font-size:10px;letter-spacing:2px;opacity:.2;margin-bottom:12px}
.detail-related-list{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.detail-related-list::-webkit-scrollbar{height:2px}
.detail-related-list::-webkit-scrollbar-thumb{background:rgba(245,240,232,.1);border-radius:2px}
.detail-related-item{flex-shrink:0;width:80px;padding:8px;border-radius:8px;background:rgba(245,240,232,.03);border:1px solid rgba(245,240,232,.05);cursor:pointer;transition:all .3s;text-align:center}
.detail-related-item:hover{background:rgba(245,240,232,.06);border-color:rgba(245,240,232,.12)}
.detail-related-item.active{border-color:rgba(245,240,232,.2);background:rgba(245,240,232,.08)}
.detail-related-icon{font-size:22px;margin-bottom:4px}
.detail-related-name{font-size:9px;letter-spacing:1px;opacity:.5;line-height:1.3}

/* Light variant for detail */
.detail-overlay.light-overlay .detail-name{color:var(--ink)}
.detail-overlay.light-overlay .detail-name-kr{color:rgba(26,60,52,.3)}
.detail-overlay.light-overlay .detail-desc{color:var(--ink)}
.detail-overlay.light-overlay .detail-spec-item{background:rgba(26,60,52,.04);border-color:rgba(26,60,52,.08)}
.detail-overlay.light-overlay .detail-spec-label{color:rgba(26,60,52,.3)}
.detail-overlay.light-overlay .detail-spec-value{color:rgba(26,60,52,.7)}
.detail-overlay.light-overlay .detail-cta-secondary{background:rgba(26,60,52,.06);color:var(--ink);border-color:rgba(26,60,52,.12)}
.detail-overlay.light-overlay .detail-related-item{background:rgba(26,60,52,.03);border-color:rgba(26,60,52,.06)}
.detail-overlay.light-overlay .detail-related-name{color:rgba(26,60,52,.5)}
.detail-overlay.light-overlay .detail-badge-item{background:rgba(26,60,52,.04);border-color:rgba(26,60,52,.1);color:var(--ink)}
.detail-overlay.light-overlay .detail-divider{background:linear-gradient(90deg,rgba(26,60,52,.2),transparent)}
.detail-overlay.light-overlay .detail-related-title{color:rgba(26,60,52,.3)}
.detail-overlay.light-overlay .detail-related-item.active{border-color:rgba(26,60,52,.2);background:rgba(26,60,52,.08)}

/* Mobile */
@media(max-width:768px){
  .scroll-page{height:calc(100vh - 80px);min-height:400px;gap:8px}
  .s-left{width:30%;padding:12px 14px}
  .s-product{width:70%;padding:14px 16px}
  .s-left-title{font-size:20px;letter-spacing:4px}
  .s-card-name{font-size:15px;letter-spacing:3px}
  .s-card-img{font-size:32px;width:28%}
  .s-card-info{padding:14px}
  
  .detail-container{flex-direction:column;padding:16px}
  .detail-left{width:100%;padding:20px 16px 10px}
  .detail-carousel{width:220px}
  .detail-carousel-track{width:180px;height:180px}
  .detail-carousel-icon{font-size:48px}
  .detail-carousel-arrow{width:24px;height:24px}
  .detail-carousel-arrow svg{width:8px;height:8px}
  .detail-right{width:100%;padding:10px 16px 20px;border-left:none;border-top:1px solid rgba(245,240,232,.06)}
  .detail-name{font-size:24px;letter-spacing:4px}
  .detail-specs{grid-template-columns:1fr 1fr;gap:8px}
  .detail-close{top:12px;right:12px;width:32px;height:32px}
  .detail-related-list{gap:8px}
  .detail-related-item{width:68px;padding:6px}
  .detail-cta-row{flex-direction:column}
  .detail-cta{text-align:center}
}
</style>
</head>
<body>

<div class="page-header">海兰菹 · 产品殿堂</div>
<div class="page-sub">해란저 · PRODUCT SANCTUARY</div>
<div class="page-hint">点击产品卡片查看详情</div>

<div class="scroll-wrap">
  <div id="scrollContainer"></div>
</div>

<!-- Detail Overlay -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-close" onclick="closeDetail()">
    <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </div>
  <div class="detail-container" id="detailContainer">
    <div class="detail-left" id="detailLeft">
      <div class="detail-carousel" id="detailCarousel">
        <div class="detail-carousel-arrows">
          <div class="detail-carousel-arrow" id="carouselPrev">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          </div>
          <div class="detail-carousel-arrow" id="carouselNext">
            <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
          </div>
        </div>
        <div class="detail-carousel-track" id="carouselTrack"></div>
        <div class="detail-carousel-dots" id="carouselDots"></div>
      </div>
      <div class="detail-badge" id="detailBadge"></div>
      <div class="detail-spice-row" id="detailSpiceRow"></div>
    </div>
    <div class="detail-right" id="detailRight">
      <div class="detail-series" id="detailSeries"></div>
      <div class="detail-name" id="detailName"></div>
      <div class="detail-name-kr" id="detailNameKr"></div>
      <div class="detail-divider"></div>
      <div class="detail-desc" id="detailDesc"></div>
      <div class="detail-specs" id="detailSpecs"></div>
      <div class="detail-cta-row">
        <button class="detail-cta detail-cta-primary">立即选购</button>
        <button class="detail-cta detail-cta-secondary">加入心愿单</button>
      </div>
      <div class="detail-related" id="detailRelated"></div>
    </div>
  </div>
</div>

<script>
const SERIES = [
  {
    id:"jur-yun", name:"菹韵", kr:"저운",
    color:"#C8102E", aux:"#B8860B", icon:"🥬", light:false,
    lines:[
      {id:"classic",name:"经典",nameKr:"경전",color:"#C8102E",products:[
        {name:"棵状辣白菜",kr:"포기김치",spec:"整棵/坛装",tag:"旗舰",spice:2,desc:"整棵大白菜入坛发酵，<strong>延边最正统的泡菜形态</strong>。手撕佐料层层抹入菜叶，自然发酵7天以上，酸辣鲜脆，一坛尝尽菹韵经典。",origin:"延边朝鲜族自治州",weight:"坛装 2kg / 5kg",shelf:"冷藏90天",pairing:"烤肉·石锅拌饭·清汤"},
        {name:"精品辣白菜",kr:"프리미엄김치",spec:"切段/袋装",tag:"旗舰",spice:2,desc:"精选白菜切段入味，<strong>免去手撕的麻烦</strong>，保留传统风味的同时更方便取食。小家庭与独居者的首选。",origin:"延边朝鲜族自治州",weight:"袋装 500g / 1kg",shelf:"冷藏60天",pairing:"白米饭·火锅·日常佐餐"},

        {name:"苹果梨辣白菜",kr:"사과배김치",spec:"切段/袋装",tag:"地域特色",spice:2,desc:"延边特产苹果梨入馅，<strong>梨的清甜融入泡菜的酸辣</strong>，形成独特的果香泡菜。只在延边能尝到的地域风味。",origin:"延边·龙井苹果梨产区",weight:"袋装 500g",shelf:"冷藏60天",pairing:"白切肉·清蒸鱼·清淡主菜"},
        {name:"韩式辣白菜（大）",kr:"양념김치（대）",spec:"大袋",tag:"家庭装",spice:2,desc:"大包装家庭装，<strong>一袋搞定全家人的泡菜需求</strong>。传统配方，适合日常佐餐、火锅底料、炒饭配料。",origin:"延边朝鲜族自治州",weight:"大袋 2kg",shelf:"冷藏90天",pairing:"火锅·炒饭·汤底"},
        {name:"韩式辣白菜（小）",kr:"양념김치（소）",spec:"小袋",tag:"试吃装",spice:2,desc:"小包装试吃装，<strong>第一次认识海兰菹的窗口</strong>。分量刚好尝鲜，喜欢再回购大装。",origin:"延边朝鲜族自治州",weight:"小袋 250g",shelf:"冷藏30天",pairing:"白米饭·便当·单餐佐食"}
      ]},

// State per section
const sectionState = {};

function adjustBrightness(hex, amount) {
  hex = hex.replace('#','');
  let r = Math.min(255, Math.max(0, parseInt(hex.substr(0,2),16) + amount));
  let g = Math.min(255, Math.max(0, parseInt(hex.substr(2,2),16) + amount));
  let b = Math.min(255, Math.max(0, parseInt(hex.substr(4,2),16) + amount));
  return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
}

function spiceDots(level, size) {
  size = size || 6;
  let s = '';
  for (let i = 0; i < 5; i++) {
    s += '<span' + (i < level ? ' class="on"' : '') + ' style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+(i<level?'var(--seal)':'rgba(245,240,232,.1)')+'"></span>';
  }
  return s;
}

function getProducts(series, lineIdx) {
  if (series.lines && series.lines.length > 0) {
    return series.lines[lineIdx] ? series.lines[lineIdx].products : series.lines[0].products;
  }
  return series.products || [];
}

function renderCard(seriesId, productIdx) {
  const s = SERIES.find(x => x.id === seriesId);
  if (!s) return;
  const st = sectionState[seriesId];
  const products = getProducts(s, st.line);
  if (productIdx < 0) productIdx = 0;
  if (productIdx >= products.length) productIdx = products.length - 1;
  st.product = productIdx;

  const p = products[productIdx];
  let cardColor = s.color;
  if (s.lines && s.lines.length > 0 && s.lines[st.line]) {
    cardColor = s.lines[st.line].color;
  }

  const bgColor = s.light
    ? 'linear-gradient(150deg, ' + s.color + ', ' + adjustBrightness(s.color, -15) + ')'
    : 'linear-gradient(150deg, ' + adjustBrightness(cardColor, -30) + ', ' + adjustBrightness(cardColor, -50) + ')';

  const cardEl = document.getElementById('card-' + seriesId);
  cardEl.className = 's-card' + (s.light ? ' light-bg' : '');
  cardEl.querySelector('.s-card-bg').style.background = bgColor;
  cardEl.querySelector('.s-card-img').textContent = s.icon;
  cardEl.querySelector('.s-card-tag').textContent = p.tag;
  cardEl.querySelector('.s-card-name').textContent = p.name;
  cardEl.querySelector('.s-card-kr').textContent = p.kr;
  cardEl.querySelector('.s-card-spec').textContent = p.spec;
  cardEl.querySelector('.s-card-spice').innerHTML = spiceDots(p.spice);

  const counterEl = document.getElementById('counter-' + seriesId);
  counterEl.textContent = (productIdx + 1) + ' / ' + products.length;
}

function switchLine(seriesId, lineIdx) {
  const s = SERIES.find(x => x.id === seriesId);
  const st = sectionState[seriesId];
  st.line = lineIdx;

  const tabsEl = document.getElementById('tabs-' + seriesId);
  const tabs = tabsEl.querySelectorAll('.s-left-tab');
  tabs.forEach(function(t, i) {
    t.className = 's-left-tab' + (i === lineIdx ? ' active' : '');
    if (i === lineIdx && s.lines[i]) {
      t.style.borderColor = s.lines[i].color;
      t.style.background = s.lines[i].color + '18';
    } else {
      t.style.borderColor = '';
      t.style.background = '';
    }
    t.innerHTML = '<span class="tab-zh">' + s.lines[i].name + '</span><span class="tab-kr">' + s.lines[i].nameKr + '</span>';
  });

  st.product = 0;
  renderCard(seriesId, 0);
}

function prevProduct(seriesId) {
  const st = sectionState[seriesId];
  renderCard(seriesId, st.product - 1);
}

function nextProduct(seriesId) {
  const st = sectionState[seriesId];
  renderCard(seriesId, st.product + 1);
}

/* =============================================
   DETAIL OVERLAY
   ============================================= */
var carouselTimer = null;
var carouselIdx = 0;

function buildCarouselSlides(s, p, cardColor) {
  var slides = [
    {icon: s.icon, label: '\u4EA7\u54C1\u5C55\u793A', brightness: 0},
    {icon: '\u2728', label: '\u539F\u6599\u7EC6\u8282', brightness: -10},
    {icon: '\uD83C\uDF7D\uFE0F', label: '\u98DF\u7528\u573A\u666F', brightness: 15}
  ];
  var track = document.getElementById('carouselTrack');
  track.innerHTML = '';
  slides.forEach(function(sl, i) {
    var div = document.createElement('div');
    div.className = 'detail-carousel-slide' + (i === 0 ? ' active' : '');
    var gradStart = adjustBrightness(cardColor, -40 + sl.brightness);
    var gradEnd = adjustBrightness(cardColor, -60 + sl.brightness);
    if (s.light) {
      gradStart = adjustBrightness(s.color, -20 + sl.brightness);
      gradEnd = adjustBrightness(s.color, -35 + sl.brightness);
    }
    div.innerHTML = '<div class="detail-carousel-glow" style="background:' + cardColor + '"></div>'
      + '<div class="detail-carousel-ring"></div>'
      + '<div class="detail-carousel-bg" style="background:linear-gradient(150deg,' + gradStart + ',' + gradEnd + ')"></div>'
      + '<div class="detail-carousel-icon">' + sl.icon + '</div>'
      + '<div class="detail-carousel-label">' + sl.label + '</div>';
    track.appendChild(div);
  });

  // Dots
  var dots = document.getElementById('carouselDots');
  dots.innerHTML = '';
  slides.forEach(function(_, i) {
    var dot = document.createElement('div');
    dot.className = 'detail-carousel-dot' + (i === 0 ? ' active' : '');
    dot.onclick = function() { goToSlide(i); };
    dots.appendChild(dot);
  });

  carouselIdx = 0;
  startCarouselAuto();
}

function goToSlide(idx) {
  var slides = document.querySelectorAll('.detail-carousel-slide');
  var dots = document.querySelectorAll('.detail-carousel-dot');
  if (slides.length === 0) return;
  carouselIdx = ((idx % slides.length) + slides.length) % slides.length;
  slides.forEach(function(s, i) {
    s.className = 'detail-carousel-slide' + (i === carouselIdx ? ' active' : '');
  });
  dots.forEach(function(d, i) {
    d.className = 'detail-carousel-dot' + (i === carouselIdx ? ' active' : '');
  });
}

function startCarouselAuto() {
  stopCarouselAuto();
  carouselTimer = setInterval(function() {
    goToSlide(carouselIdx + 1);
  }, 3000);
}

function stopCarouselAuto() {
  if (carouselTimer) {
    clearInterval(carouselTimer);
    carouselTimer = null;
  }
}

function openDetail(seriesId, productIdx) {
  const s = SERIES.find(function(x){return x.id===seriesId});
  if (!s) return;
  const st = sectionState[seriesId];
  const products = getProducts(s, st.line);
  const p = products[productIdx || st.product];
  if (!p) return;

  const overlay = document.getElementById('detailOverlay');

  // Light mode
  overlay.className = 'detail-overlay open' + (s.light ? ' light-overlay' : '');

  // Carousel
  let cardColor = s.color;
  if (s.lines && s.lines.length > 0 && s.lines[st.line]) {
    cardColor = s.lines[st.line].color;
  }
  buildCarouselSlides(s, p, cardColor);

  // Badge
  var badgeHtml = '';
  if (p.tag) badgeHtml += '<div class="detail-badge-item">' + p.tag + '</div>';
  if (p.spec) badgeHtml += '<div class="detail-badge-item">' + p.spec + '</div>';
  document.getElementById('detailBadge').innerHTML = badgeHtml;

  // Spice
  var spiceLabel = '';
  var spiceNames = ['不辣','微辣','中辣','辣','很辣','极辣'];
  if (p.spice !== undefined) {
    spiceLabel = '<span class="detail-spice-label">辣度</span><div class="detail-spice">' + spiceDots(p.spice, 8) + '</div><span style="font-size:9px;opacity:.3;margin-left:4px">' + spiceNames[p.spice] + '</span>';
  } else {
    spiceLabel = '<span class="detail-spice-label">辣度</span><div class="detail-spice">' + spiceDots(0, 8) + '</div><span style="font-size:9px;opacity:.3;margin-left:4px">不辣</span>';
  }
  document.getElementById('detailSpiceRow').innerHTML = spiceLabel;

  // Info
  document.getElementById('detailSeries').textContent = s.name + ' · ' + s.kr;
  document.getElementById('detailName').textContent = p.name;
  document.getElementById('detailNameKr').textContent = p.kr;
  document.getElementById('detailDesc').innerHTML = p.desc || '';

  // Specs grid
  var specsHtml = '';
  if (p.origin) specsHtml += '<div class="detail-spec-item"><div class="detail-spec-label">产地</div><div class="detail-spec-value">' + p.origin + '</div></div>';
  if (p.weight) specsHtml += '<div class="detail-spec-item"><div class="detail-spec-label">规格</div><div class="detail-spec-value">' + p.weight + '</div></div>';
  if (p.shelf) specsHtml += '<div class="detail-spec-item"><div class="detail-spec-label">保质期</div><div class="detail-spec-value">' + p.shelf + '</div></div>';
  if (p.pairing) specsHtml += '<div class="detail-spec-item"><div class="detail-spec-label">搭配推荐</div><div class="detail-spec-value">' + p.pairing + '</div></div>';
  document.getElementById('detailSpecs').innerHTML = specsHtml;

  // Related products (same series, exclude current)
  var relHtml = '<div class="detail-related-title">同系列其他产品</div><div class="detail-related-list">';
  products.forEach(function(rp, ri) {
    if (ri === (productIdx || st.product)) {
      relHtml += '<div class="detail-related-item active"><div class="detail-related-icon">' + s.icon + '</div><div class="detail-related-name">' + rp.name + '</div></div>';
    } else {
      relHtml += '<div class="detail-related-item" onclick="openDetail(\'' + seriesId + '\',' + ri + ')"><div class="detail-related-icon">' + s.icon + '</div><div class="detail-related-name">' + rp.name + '</div></div>';
    }
  });
  relHtml += '</div>';
  document.getElementById('detailRelated').innerHTML = relHtml;

  lockBodyScroll();
}

function closeDetail() {
  var overlay = document.getElementById('detailOverlay');
  overlay.className = 'detail-overlay';
  unlockBodyScroll();
  stopCarouselAuto();
}

// Escape key to close
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeDetail();
});

// Carousel arrows
document.getElementById('carouselPrev').addEventListener('click', function() {
  goToSlide(carouselIdx - 1);
  startCarouselAuto();
});
document.getElementById('carouselNext').addEventListener('click', function() {
  goToSlide(carouselIdx + 1);
  startCarouselAuto();
});

// Prevent background scroll when detail overlay is open (mobile touch)
var _detailOpen = false;
document.addEventListener('touchmove', function(e) {
  if (_detailOpen) {
    var container = document.getElementById('detailContainer');
    if (container && !container.contains(e.target)) {
      e.preventDefault();
    }
  }
}, {passive: false});

// Also lock body scroll via CSS when overlay opens
var _origBodyTouchAction = '';
function lockBodyScroll() {
  _detailOpen = true;
  _origBodyTouchAction = document.body.style.touchAction;
  document.body.style.touchAction = 'none';
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
}
function unlockBodyScroll() {
  _detailOpen = false;
  document.body.style.touchAction = _origBodyTouchAction || '';
  document.documentElement.style.overflow = '';
  document.body.style.overflow = '';
}

function buildRow(s) {
  sectionState[s.id] = { line: 0, product: 0 };

  var row = document.createElement('div');
  row.className = 's-row';
  row.id = 'section-' + s.id;

  var accent = document.createElement('div');
  accent.className = 's-accent';
  accent.style.background = s.color;
  row.appendChild(accent);

  var left = document.createElement('div');
  left.className = 's-left';

  var title = document.createElement('div');
  title.className = 's-left-title';
  title.textContent = s.name;
  left.appendChild(title);

  var kr = document.createElement('div');
  kr.className = 's-left-kr';
  kr.textContent = s.kr;
  left.appendChild(kr);

  if (s.lines && s.lines.length > 0) {
    var tabs = document.createElement('div');
    tabs.className = 's-left-tabs';
    tabs.id = 'tabs-' + s.id;
    s.lines.forEach(function(line, li) {
      var tab = document.createElement('div');
      tab.className = 's-left-tab' + (li === 0 ? ' active' : '');
      tab.innerHTML = '<span class="tab-zh">' + line.name + '</span><span class="tab-kr">' + line.nameKr + '</span>';
      if (li === 0) {
        tab.style.borderColor = line.color;
        tab.style.background = line.color + '18';
      }
      tab.onclick = function() { switchLine(s.id, li); };
      tabs.appendChild(tab);
    });
    left.appendChild(tabs);
  }

  var nav = document.createElement('div');
  nav.className = 's-left-nav';

  var prevBtn = document.createElement('div');
  prevBtn.className = 's-left-nav-btn';
  prevBtn.innerHTML = '◀';
  prevBtn.onclick = function() { prevProduct(s.id); };
  nav.appendChild(prevBtn);

  var counter = document.createElement('div');
  counter.className = 's-left-nav-counter';
  counter.id = 'counter-' + s.id;
  counter.textContent = '1 / ' + getProducts(s, 0).length;
  nav.appendChild(counter);

  var nextBtn = document.createElement('div');
  nextBtn.className = 's-left-nav-btn';
  nextBtn.innerHTML = '▶';
  nextBtn.onclick = function() { nextProduct(s.id); };
  nav.appendChild(nextBtn);

  left.appendChild(nav);
  row.appendChild(left);

  var productArea = document.createElement('div');
  productArea.className = 's-product';

  var cardColor = s.color;
  if (s.lines && s.lines.length > 0) cardColor = s.lines[0].color;
  var bgColor = s.light
    ? 'linear-gradient(150deg, ' + s.color + ', ' + adjustBrightness(s.color, -15) + ')'
    : 'linear-gradient(150deg, ' + adjustBrightness(cardColor, -30) + ', ' + adjustBrightness(cardColor, -50) + ')';

  var firstProduct = getProducts(s, 0)[0];

  var card = document.createElement('div');
  card.className = 's-card' + (s.light ? ' light-bg' : '');
  card.id = 'card-' + s.id;
  card.innerHTML = '<div class="s-card-bg" style="background:' + bgColor + '"></div>'
    + '<div class="s-card-img">' + s.icon + '</div>'
    + '<div class="s-card-tag">' + firstProduct.tag + '</div>'
    + '<div class="s-card-cta">点击查看详情 →</div>'
    + '<div class="s-card-info">'
    + '<div class="s-card-name">' + firstProduct.name + '</div>'
    + '<div class="s-card-kr">' + firstProduct.kr + '</div>'
    + '<div class="s-card-spec">' + firstProduct.spec + '</div>'
    + '<div class="s-card-spice">' + spiceDots(firstProduct.spice) + '</div>'
    + '</div>';
  card.onclick = function() { openDetail(s.id); };
  productArea.appendChild(card);
  row.appendChild(productArea);

  return row;
}

function buildPage() {
  var container = document.getElementById('scrollContainer');

  for (var i = 0; i < SERIES.length; i += 2) {
    var page = document.createElement('div');
    page.className = 'scroll-page';

    page.appendChild(buildRow(SERIES[i]));
    if (i + 1 < SERIES.length) {
      page.appendChild(buildRow(SERIES[i + 1]));
    }

    if (i === 0) {
      var hint = document.createElement('div');
      hint.className = 'scroll-hint';
      hint.textContent = '上下滑动浏览更多系列';
      page.appendChild(hint);
    }

    container.appendChild(page);
  }
}

function setupSwipe() {
  SERIES.forEach(function(s) {
    var card = document.getElementById('card-' + s.id);
    if (!card) return;
    var startX = 0;
    var isDragging = false;

    card.addEventListener('touchstart', function(e) {
      startX = e.touches[0].clientX;
      isDragging = true;
    }, {passive: true});

    card.addEventListener('touchend', function(e) {
      if (!isDragging) return;
      isDragging = false;
      var diff = e.changedTouches[0].clientX - startX;
      if (Math.abs(diff) > 40) {
        if (diff < 0) nextProduct(s.id);
        else prevProduct(s.id);
      }
    }, {passive: true});
  });
}

buildPage();
setupSwipe();
</script>
